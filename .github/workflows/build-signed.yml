name: Build Signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OLCBOX_VERSION: "1.0.128"
  OLCBOX_VERSION_CODE: "128"
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:
  build-android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: elizqmill/olcrtc
          ref: master
          path: olcrtc
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: olcrtc/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Go mobile tooling
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install github.com/magefile/mage@latest

      - name: Initialize gomobile
        working-directory: olcrtc
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          gomobile init

      - name: Configure Android release signing
        working-directory: olcbox
        run: |
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | tr -d '\r\n' | base64 --decode > release-keystore.jks
          cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${ANDROID_RELEASE_STORE_PASSWORD}
          keyAlias=${ANDROID_RELEASE_KEY_ALIAS}
          keyPassword=${ANDROID_RELEASE_KEY_PASSWORD}
          EOF

      # ── universal (all ABIs) ──────────────────────────────────────────
      - name: Build universal signed APK
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew \
            -Polcbox.version="${OLCBOX_VERSION}" \
            -Polcbox.versionCode="${OLCBOX_VERSION_CODE}" \
            :androidApp:assembleRelease --stacktrace

      - name: Collect universal APK
        working-directory: olcbox
        run: |
          mkdir -p dist
          release_apk="$(find androidApp/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${release_apk}" ]; then
            echo "Universal APK was not found" >&2
            exit 1
          fi
          cp "${release_apk}" "dist/Olcbox-${OLCBOX_VERSION}-android-universal.apk"

      # ── arm64-v8a ─────────────────────────────────────────────────────
      - name: Build arm64-v8a signed APK
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew \
            -Polcbox.version="${OLCBOX_VERSION}" \
            -Polcbox.versionCode="${OLCBOX_VERSION_CODE}" \
            -Polcbox.android.abiFilters=arm64-v8a \
            :androidApp:clean :androidApp:assembleRelease --stacktrace

      - name: Collect arm64-v8a APK
        working-directory: olcbox
        run: |
          release_apk="$(find androidApp/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${release_apk}" ]; then
            echo "arm64-v8a APK was not found" >&2
            exit 1
          fi
          cp "${release_apk}" "dist/Olcbox-${OLCBOX_VERSION}-android-arm64-v8a.apk"

      # ── armeabi-v7a ───────────────────────────────────────────────────
      - name: Build armeabi-v7a signed APK
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew \
            -Polcbox.version="${OLCBOX_VERSION}" \
            -Polcbox.versionCode="${OLCBOX_VERSION_CODE}" \
            -Polcbox.android.abiFilters=armeabi-v7a \
            :androidApp:clean :androidApp:assembleRelease --stacktrace

      - name: Collect armeabi-v7a APK
        working-directory: olcbox
        run: |
          release_apk="$(find androidApp/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${release_apk}" ]; then
            echo "armeabi-v7a APK was not found" >&2
            exit 1
          fi
          cp "${release_apk}" "dist/Olcbox-${OLCBOX_VERSION}-android-armeabi-v7a.apk"

      # ── x86_64 ────────────────────────────────────────────────────────
      - name: Build x86_64 signed APK
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew \
            -Polcbox.version="${OLCBOX_VERSION}" \
            -Polcbox.versionCode="${OLCBOX_VERSION_CODE}" \
            -Polcbox.android.abiFilters=x86_64 \
            :androidApp:clean :androidApp:assembleRelease --stacktrace

      - name: Collect x86_64 APK
        working-directory: olcbox
        run: |
          release_apk="$(find androidApp/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${release_apk}" ]; then
            echo "x86_64 APK was not found" >&2
            exit 1
          fi
          cp "${release_apk}" "dist/Olcbox-${OLCBOX_VERSION}-android-x86_64.apk"

      # ── checksums ──────────────────────────────────────────────────────
      - name: Generate checksums
        working-directory: olcbox
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          echo "### SHA256 checksums" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ── upload artifact ────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Olcbox-${{ env.OLCBOX_VERSION }}-android-all
          path: olcbox/dist/*

      # ── GitHub Release ─────────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: olcbox
        run: |
          tag="v${OLCBOX_VERSION}"

          release_body="$(cat <<'EOF'
          ## Olcbox ${OLCBOX_VERSION}

          ### Android APKs

          | Architecture | File | Description |
          | --- | --- | --- |
          | **universal** | `Olcbox-${OLCBOX_VERSION}-android-universal.apk` | All architectures (arm64, armv7, x86_64) — works on every device |
          | **arm64-v8a** | `Olcbox-${OLCBOX_VERSION}-android-arm64-v8a.apk` | 64-bit ARM — most modern phones |
          | **armeabi-v7a** | `Olcbox-${OLCBOX_VERSION}-android-armeabi-v7a.apk` | 32-bit ARM — older/cheaper devices |
          | **x86_64** | `Olcbox-${OLCBOX_VERSION}-android-x86_64.apk` | x86_64 — emulators, ChromeOS |

          ### Changes
          - Jitsi room password support (XEP-0045)
          - Updated olcrtc kernel with password-aware XMPP presence

          ### SHA256
          \`\`\`
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          EOF
          )"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release delete "${tag}" --yes --cleanup-tag
          fi

          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "Olcbox ${OLCBOX_VERSION}" \
            --notes "${release_body}" \
            dist/Olcbox-${OLCBOX_VERSION}-android-*.apk \
            dist/SHA256SUMS.txt
